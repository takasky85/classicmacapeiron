name: ci

# The game itself needs SDL3 and the extracted artwork, neither of which a clean runner has. What it
# can do without either is compile every source file against the headless harness in tools/test,
# which stands in for the SDL3 calls this port uses. That is enough to catch the thing most likely
# to go wrong between rounds of work: source that has moved on from the stub it is tested against,
# or a warning that has crept in. It is exactly the check that was missed when the harness in
# tools/test fell behind src/ and stopped compiling it at all.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  headless:
    name: compile against the headless harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Warnings in src/ are errors here. The stub is test scaffolding and is built without them.
      - name: compile src/ with warnings as errors
        run: |
          for f in src/*.c; do
            echo "--- $f"
            gcc -std=gnu11 -Itools/test -Isrc \
                -Wall -Wextra -Werror -Wno-unused-parameter \
                -c "$f" -o /dev/null
          done

      # The Android half of the code (the permission request, the app's own folders, the extra
      # places the artwork is looked for) is behind __ANDROID__ and would otherwise never be
      # compiled until an APK was built. Against the stub it costs nothing to check here.
      - name: compile src/ as Android, with warnings as errors
        run: |
          for f in src/*.c; do
            gcc -std=gnu11 -D__ANDROID__ -Itools/test -Isrc \
                -Wall -Wextra -Werror -Wno-unused-parameter \
                -c "$f" -o /dev/null
          done

      # Every source file has to be in the desktop list and the Android list. Forgetting one
      # compiles fine everywhere above and fails at link time in a release.
      - name: every source file is in both build lists
        run: |
          rc=0
          for f in src/*.c; do
            b=$(basename "$f")
            for list in CMakeLists.txt android/app/jni/CMakeLists.txt; do
              grep -q "$b" "$list" || { echo "$b is not in $list"; rc=1; }
            done
          done
          exit $rc

      - name: link the headless build
        run: |
          gcc -std=gnu11 -w -Itools/test -Isrc \
              -o apeiron_headless src/*.c tools/test/sdl3_stub.c -lm

      # Without assets/ the binary should say so and stop cleanly rather than crash. Exit status 1
      # with a message is the expected outcome; a segfault (>= 128) is not.
      - name: run it without assets and expect a clean refusal
        run: |
          set +e
          NOAUDIO=1 LIMIT_MS=2000 ./apeiron_headless ./no-such-assets
          status=$?
          set -e
          echo "exit status $status"
          test "$status" -lt 128

      # The same under the Android code paths: nothing is found, nobody is at the screen, and the
      # permission request must not wait for an answer that cannot come.
      - name: run the Android build of it without assets and expect a clean refusal
        run: |
          gcc -std=gnu11 -w -D__ANDROID__ -Itools/test -Isrc \
              -o apeiron_android_headless src/*.c tools/test/sdl3_stub.c -lm
          set +e
          STUB_EXTERNAL=$PWD/none STUB_INTERNAL=$PWD/none NOAUDIO=1 LIMIT_MS=2000 \
              timeout 60 ./apeiron_android_headless
          status=$?
          set -e
          echo "exit status $status"
          test "$status" -eq 1

  # The Windows compiler, on every push, because twice now a change has compiled perfectly on
  # Linux and broken a Windows target that is only built when a release is cut - so the first
  # anyone knew of it was a failed release. MSVC has no <dirent.h> and no strcasecmp, and those
  # two cost two round trips through the release workflow to find.
  #
  # This compiles against the headless stub rather than real SDL3, so there is no SDL build and
  # the job takes about a minute. /we4013 turns "undefined; assuming extern returning int" into
  # an error, which is how a missing POSIX function shows up here - as a warning at compile time
  # and then an unresolved symbol at link time, which is where strcasecmp was found.
  msvc:
    name: compile with MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: compile every source file
        shell: cmd
        run: |
          md objs
          cl /nologo /c /W3 /we4013 /Fo:objs\ /I tools\test /I src src\*.c

  python:
    name: byte-compile the tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: compile every tool
        run: python3 -m compileall -q tools

  # The APK is the one build that can break without anybody noticing until a release: nothing
  # else here compiles the game for Android or exercises the Gradle project. Debug build only,
  # which is enough to catch a broken manifest, a missing resource, a source file that was
  # added to CMakeLists but not to the Android one, or an SDL package that no longer unpacks.
  android:
    name: build the Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Not the runner's Gradle: it is version 9, and the Android plugin this project uses is
      # an 8.x, which fails against it with a misleading error about DependencyHandler.module.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: fetch SDL's prebuilt Android package
        run: ./android/get-sdl.sh
      - name: assemble
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cd android
          gradle --no-daemon assembleDebug -PapeironNdk="$(basename "$ANDROID_NDK_HOME")"
      - name: what came out
        run: |
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          ls -la "$apk"
          unzip -l "$apk" | grep -E 'lib/|AndroidManifest'
          # Both classes the manifest and SDL need must be in the dex.
          for c in 'Lorg/libsdl/app/SDLActivity;' 'Lio/github/takasky85/apeiron/MainActivity;'; do
            unzip -p "$apk" 'classes*.dex' | grep -aq "$c" || { echo "missing $c"; exit 1; }
          done
