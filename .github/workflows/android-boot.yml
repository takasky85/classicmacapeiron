name: android boot test

# Boots the APK in an emulator and insists the game got as far as opening a window, twice over
# with the process left alive in between.
#
# Deliberately NOT on every push. It takes the better part of an hour - building SDL for a third
# ABI, creating an AVD and booting it - and it is not how the startup bug that prompted it was
# found: that came from reading SDLActivity.onCreate. The game now reports on itself instead, on
# the screen, which is quicker to read and works on the real machine. See src/diag.c.
#
# What this is still good for is the one thing a person testing by hand will not think to do:
# launch, go to the home screen, and launch again without the process dying in between. That is
# the case that broke, and it is cheap to leave standing for when the Android project changes.
#
# Runs on demand, and when something under android/ does.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'

jobs:
  boot:
    name: boot the APK in an emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: fetch SDL for the Android port
        run: ./android/fetch-sdl.sh

      # x86_64 only: it is the ABI the emulator can run, and one instead of three keeps SDL's
      # compile within reason. The ARM libraries are what ship, and ci.yml builds those.
      - name: build an x86_64 APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cd android
          gradle --no-daemon assembleDebug \
                 -PapeironNdk="$(basename "$ANDROID_NDK_HOME")" \
                 -PapeironAbis=x86_64

      # The emulator needs hardware virtualisation, which the runner has but does not hand to
      # an unprivileged user by default.
      - name: let anyone use /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 28 on purpose: it is what the app targets, so this is the storage behaviour the
      # game is written against rather than a newer one it deliberately avoids.
      - name: boot it
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./android/boot-test.sh
