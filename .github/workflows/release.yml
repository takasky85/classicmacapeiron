name: release

# Builds the game for each desktop platform and attaches the results to a GitHub Release.
#
# Each build links SDL3 statically, so every artifact is a single executable with nothing beside it
# - no SDL3.dll, no MinGW runtime, no libiconv. SDL is zlib-licensed, which allows that as long as
# its notice travels along, so SDL's LICENSE.txt goes in each archive.
#
# No assets. assets/ holds Ambrosia Software's artwork, fonts and sounds, and it is not in this
# repository and not in these builds: you make it from your own copy of Apeiron with
# tools/extract_assets.py. The game looks for ./assets beside itself and takes a path as its first
# argument, and without it stops at startup saying so.
#
# Trigger: any tag, however it is named - pushed from a terminal, or created by making a release in
# the browser. Or run it by hand from the Actions tab: with the tag box empty it builds and uploads
# the three archives as run artifacts and touches no release; with a tag name it also attaches them
# to that tag's release, creating it if it does not exist.

on:
  push:
    # ANY tag. An allowlist of patterns was a mistake: tags named claude1 and claude2 matched
    # none of v*, alpha* or beta*, so creating them built nothing and attached nothing, silently.
    # If you make a tag, you want the binaries.
    tags: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as a release (leave blank to only build artifacts)'
        required: false

permissions:
  contents: write

jobs:
  # One stamp for the whole release, worked out once on Linux where the time zone database is
  # certainly there. Doing it inside each build would give the three archives three different
  # stamps, and Windows bash cannot be relied on to know what America/Los_Angeles is.
  stamp:
    name: stamp the build
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
      name: ${{ steps.s.outputs.name }}
    steps:
      - id: s
        run: |
          echo "stamp=$(TZ=America/Los_Angeles date +%y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: stamp
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            # The MSVC runtime is linked statically too, so the exe needs no redistributable.
            cmake_extra: >-
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
              -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
            binary: apeiron.exe
          - name: linux-x86_64
            os: ubuntu-latest
            cmake_extra: ''
            binary: apeiron
          - name: macos-universal
            os: macos-latest
            # The quotes matter. CMAKE_OSX_ARCHITECTURES takes a semicolon-separated list, and a
            # bare semicolon in a run: line is a shell command separator - the configure step then
            # ran as two commands, the second being `x86_64`, which exited 127 with "command not
            # found" after cmake had already configured for arm64 alone.
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
            binary: Apeiron.app

    steps:
      - uses: actions/checkout@v4

      # SDL3 builds its video and audio backends against the system's development headers. Without
      # these, SDL still configures but comes out with no working video driver on Linux - and from
      # the 3.4 series a dependency it looks for and cannot find fails the configure outright, so
      # this list and the one in build.yml have to stay the same list.
      - name: install SDL3's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libxtst-dev libpipewire-0.3-dev libsamplerate0-dev

      # SDL3's source is fetched by CMake, so caching it keeps a release build to a couple of
      # minutes instead of re-cloning and rebuilding SDL every time.
      - name: cache the SDL3 build
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: sdl3-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}

      - name: configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DAPEIRON_STATIC_SDL=ON
          -DAPEIRON_BUILD_STAMP=${{ needs.stamp.outputs.stamp }}
          -DAPEIRON_BUILD_NAME=${{ needs.stamp.outputs.name }}
          ${{ matrix.cmake_extra }}

      - name: build
        run: cmake --build build --config Release --parallel

      # MSVC puts the executable in a per-configuration subdirectory; the single-config generators
      # do not. Find it rather than guess.
      - name: collect the artifact
        shell: bash
        run: |
          set -e
          stage="apeiron-${{ matrix.name }}"
          mkdir -p "$stage"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # A bundle, not a file: copy the whole .app across with its icon and Info.plist.
            app=$(find build -maxdepth 3 -name 'Apeiron.app' -type d | head -1)
            test -n "$app" || { echo "no Apeiron.app under build/"; find build -maxdepth 3 | head -40; exit 1; }
            echo "found $app"
            cp -R "$app" "$stage/"
            exe="$app/Contents/MacOS/Apeiron"
          else
            exe=$(find build -maxdepth 3 -name '${{ matrix.binary }}' -type f | head -1)
            test -n "$exe" || { echo "no ${{ matrix.binary }} under build/"; find build -maxdepth 3 -type f | head -40; exit 1; }
            echo "found $exe"
            cp "$exe" "$stage/"
          fi
          cp README.md "$stage/"
          find build/_deps -name 'LICENSE.txt' -path '*sdl*' -exec cp {} "$stage/SDL-LICENSE.txt" \; || true

          cat > "$stage/HOW-TO-RUN.txt" <<'TXT'
          Apeiron - SDL3 port
          ===================

          This build does NOT include the game's artwork, fonts or sounds. Those are Ambrosia
          Software's, and they live in the game's own resource forks - so you make them from your
          own copy of Apeiron rather than downloading them from here:

              python3 tools/extract_assets.py <the installed Apeiron folder> assets

          Put the resulting "assets" folder beside this executable, or pass its path:

              apeiron /some/where/assets

          On a Mac, put it beside Apeiron.app or inside Apeiron.app/Contents/Resources.

          If the game cannot find it, it puts up a folder picker and remembers what you choose,
          so you only have to point at it once.

          The port and its tools are in this repository; see README.md.
          SDL3 is linked statically and is zlib-licensed - see SDL-LICENSE.txt.
          TXT

          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$stage.zip" "$stage"
          else
            tar czf "$stage.tar.gz" "$stage"
          fi
          ls -la apeiron-*

      - name: check the binary refuses a missing assets folder cleanly
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          if [ "${{ runner.os }}" = "macOS" ]; then
            exe=$(find build -maxdepth 4 -path '*Apeiron.app/Contents/MacOS/Apeiron' | head -1)
          else
            exe=$(find build -maxdepth 3 -name '${{ matrix.binary }}' -type f | head -1)
          fi
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy "$exe" ./no-such-assets
          status=$?
          set -e
          echo "exit status $status"
          test "$status" -lt 128          # a message and a non-zero exit, not a crash

      - uses: actions/upload-artifact@v4
        with:
          name: apeiron-${{ matrix.name }}
          path: |
            apeiron-*.zip
            apeiron-*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------- libretro cores
  # The same game sources, built against a libretro backend instead of SDL. RetroArch supplies the
  # window, the on-screen controls and the content browser, which is what makes a phone and a
  # Google TV box practical targets at all.
  cores:
    name: ${{ matrix.name }}
    needs: stamp
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libretro-windows-x86_64
            platform: win
            artifact: apeiron_libretro.dll
          - name: libretro-android-armv7
            platform: android-armv7
            artifact: apeiron_libretro_android.so
            abi: armeabi-v7a
          - name: libretro-android-arm64
            platform: android-arm64
            artifact: apeiron_libretro_android.so
            abi: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - name: install the MinGW cross compiler
        if: matrix.platform == 'win'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: build the core
        run: |
          set -e
          export NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          make -C libretro platform=${{ matrix.platform }} \
               BUILD_STAMP=${{ needs.stamp.outputs.stamp }} \
               BUILD_NAME=${{ needs.stamp.outputs.name }}

      - name: collect the artifact
        run: |
          set -e
          core=$(find build-libretro -name '${{ matrix.artifact }}' -type f | head -1)
          test -n "$core" || { echo "no ${{ matrix.artifact }}"; find build-libretro | head -40; exit 1; }
          file "$core"
          stage="apeiron-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "$core" "$stage/"
          cp libretro/apeiron_libretro.info "$stage/"
          cp README.md "$stage/"
          cat > "$stage/HOW-TO-RUN.txt" <<'TXT'
          Apeiron - a libretro core
          =========================

          Put the core where RetroArch keeps its cores, and the .info file beside it.

          The artwork is NOT in here. It is Ambrosia Software's, and this port reads it out of
          the game's own resource forks rather than shipping copies. Make it from your own copy:

              python3 tools/extract_assets.py <the installed Apeiron folder> assets

          Then put that folder in RetroArch's *system* directory as:

              <system>/apeiron/assets

          and start the core with no content. If you would rather keep the artwork somewhere
          else, use "Load Content" and pick any file inside your assets folder instead.

          Controls: the left stick or the d-pad steers, B or A fires, Start pauses, Select goes
          back to the title. In the menus the stick moves a pointer and A clicks; a touch screen
          works there too.
          TXT
          tar czf "$stage.tar.gz" "$stage"
          ls -la apeiron-*

      - uses: actions/upload-artifact@v4
        with:
          name: apeiron-${{ matrix.name }}
          path: apeiron-*.tar.gz
          if-no-files-found: error

  # ----------------------------------------------------------------------- the Android build
  # A sideloadable APK rather than a libretro core: it appears on the Google TV home screen by
  # itself, and finds its artwork through the game's own folder browser instead of RetroArch's
  # system directory.
  android:
    name: android-apk
    needs: stamp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: fetch SDL for the Android port
        run: ./android/fetch-sdl.sh

      - name: build the APK
        run: |
          set -e
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          NDKVER=$(basename "$ANDROID_NDK_HOME")
          echo "building against NDK $NDKVER"
          cd android
          gradle --no-daemon assembleRelease \
                 -PapeironNdk="$NDKVER" \
                 -PapeironStamp=${{ needs.stamp.outputs.stamp }} \
                 -PapeironName=${{ needs.stamp.outputs.name }}

      - name: collect the artifact
        run: |
          set -e
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$apk" || { find android/app/build/outputs | head -40; exit 1; }
          stage="apeiron-android"
          mkdir -p "$stage"
          cp "$apk" "$stage/apeiron.apk"
          cp README.md "$stage/"
          unzip -l "$apk" | grep -E 'lib/|\.so' || true
          cat > "$stage/HOW-TO-RUN.txt" <<'TXT'
          Apeiron for Android and Google TV
          =================================

          Sideload apeiron.apk. On a Google TV box the usual way is the Downloader app, or
          `adb install apeiron.apk` over the network.

          The artwork is NOT in here. It is Ambrosia Software's, and this port reads it out of
          the game's own resource forks rather than shipping copies. Make it from your own copy:

              python3 tools/extract_assets.py <the installed Apeiron folder> assets

          Copy that "assets" folder onto the device - Downloads is the easiest place - and the
          first time the game starts it will show a browser so you can go and find it. It
          remembers where it is after that.

          Grant storage permission when it asks, or the browser will show empty folders.

          Controls: a mouse works, including for steering, if you have one plugged in. Otherwise
          the d-pad or a stick steers and the A button fires. In the menus the stick moves a
          pointer and A clicks.
          TXT
          tar czf "$stage.tar.gz" "$stage"
          ls -la apeiron-android*

      - uses: actions/upload-artifact@v4
        with:
          name: apeiron-android
          path: apeiron-android.tar.gz
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [build, cores, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # draft is deliberately not set. Forcing draft: true would have un-published a release
          # made by hand in the browser, which is how releases get made here - the workflow's job
          # is to attach binaries to it, not to change its state.
          generate_release_notes: true
          files: dist/*
          body: |
            ## What is in these downloads

            One executable per platform, with SDL3 linked in. Nothing else is needed to run it -
            no SDL3.dll, no MinGW runtime, no libiconv.

            | | |
            | - | - |
            | `apeiron-windows-x86_64.zip` | Windows 10/11, 64-bit |
            | `apeiron-linux-x86_64.tar.gz` | Linux, 64-bit |
            | `apeiron-macos-universal.tar.gz` | macOS, Apple silicon and Intel - a .app bundle |
            | `apeiron-libretro-windows-x86_64.tar.gz` | a RetroArch core for Windows |
            | `apeiron-libretro-android-armv7.tar.gz` | a RetroArch core for 32-bit ARM Android |
            | `apeiron-libretro-android-arm64.tar.gz` | a RetroArch core for 64-bit ARM Android |
            | `apeiron-android.tar.gz` | a sideloadable APK for Google TV and Android |

            ## What is NOT in them

            **The game's artwork, fonts and sounds.** Those are Ambrosia Software's, and this port
            reads them out of the game's own resource forks rather than shipping copies. Make them
            from your own copy of Apeiron:

            ```
            python3 tools/extract_assets.py <the installed Apeiron folder> assets
            ```

            Put the `assets` folder beside the executable, or pass its path as the first argument.
            Without it the game stops at startup and says `missing assets`.
