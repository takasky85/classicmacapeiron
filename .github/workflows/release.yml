name: release

# Builds the game for the two platforms that are shipped - Windows 11 on x86-64 and 32-bit ARM
# Android (Google TV) - and attaches the results to a GitHub Release. The Linux, macOS and libretro
# builds are gone from CI; the source for them is still in the repository.
#
# The Windows build links SDL3 statically, so it is a single executable with nothing beside it - no
# SDL3.dll, no MinGW runtime, no libiconv. SDL is zlib-licensed, which allows that as long as its
# notice travels along, so SDL's LICENSE.txt goes in the archive. The Android build uses SDL's own
# prebuilt AAR rather than compiling SDL.
#
# No assets. assets/ holds Ambrosia Software's artwork, fonts and sounds, and it is not in this
# repository and not in these builds: you make it from your own copy of Apeiron with
# tools/extract_assets.py. The game looks for ./assets beside itself and takes a path as its first
# argument, and without it stops at startup saying so.
#
# Trigger: any tag, however it is named - pushed from a terminal, or created by making a release in
# the browser. Or run it by hand from the Actions tab: with the tag box empty it builds and uploads
# the archives as run artifacts and touches no release; with a tag name it also attaches them
# to that tag's release, creating it if it does not exist.

on:
  push:
    # ANY tag. An allowlist of patterns was a mistake: tags named claude1 and claude2 matched
    # none of v*, alpha* or beta*, so creating them built nothing and attached nothing, silently.
    # If you make a tag, you want the binaries.
    tags: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as a release (leave blank to only build artifacts)'
        required: false

permissions:
  contents: write

jobs:
  # One stamp for the whole release, worked out once on Linux where the time zone database is
  # certainly there. Doing it inside each build would give the three archives three different
  # stamps, and Windows bash cannot be relied on to know what America/Los_Angeles is.
  stamp:
    name: stamp the build
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
      name: ${{ steps.s.outputs.name }}
    steps:
      - id: s
        run: |
          echo "stamp=$(TZ=America/Los_Angeles date +%y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  windows:
    name: windows-x86_64
    needs: stamp
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # SDL3's source is fetched by CMake, so caching it keeps a release build to a couple of
      # minutes instead of re-cloning and rebuilding SDL every time.
      - name: cache the SDL3 build
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: sdl3-windows-x86_64-${{ hashFiles('CMakeLists.txt') }}

      - name: configure
        # The MSVC runtime is linked statically too, so the exe needs no redistributable.
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DAPEIRON_STATIC_SDL=ON
          -DAPEIRON_BUILD_STAMP=${{ needs.stamp.outputs.stamp }}
          -DAPEIRON_BUILD_NAME=${{ needs.stamp.outputs.name }}
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_POLICY_DEFAULT_CMP0091=NEW

      - name: build
        run: cmake --build build --config Release --parallel

      # MSVC puts the executable in a per-configuration subdirectory. Find it rather than guess.
      - name: collect the artifact
        shell: bash
        run: |
          set -e
          stage="apeiron-windows-x86_64"
          mkdir -p "$stage"
          exe=$(find build -maxdepth 3 -name 'apeiron.exe' -type f | head -1)
          test -n "$exe" || { echo "no apeiron.exe under build/"; find build -maxdepth 3 -type f | head -40; exit 1; }
          echo "found $exe"
          cp "$exe" "$stage/"
          cp README.md "$stage/"
          find build/_deps -name 'LICENSE.txt' -path '*sdl*' -exec cp {} "$stage/SDL-LICENSE.txt" \; || true
          # The extractor, with the two free fonts it needs (credited and licensed in fonts/).
          cp downloads/apeiron-asset-tools.zip "$stage/"
          mkdir -p "$stage/fonts"
          cp tools/fonts/* "$stage/fonts/"

          cat > "$stage/HOW-TO-RUN.txt" <<'TXT'
          Apeiron - SDL3 port
          ===================

          This build does NOT include the game's artwork or sounds. Those are Ambrosia Software's,
          and they live in the game's own resource forks - so the game makes its own from your
          copy of Apeiron rather than you downloading them from here.

          Just start apeiron.exe. If it finds your Apeiron 1.0.3 zip (in Downloads, on the
          Desktop, in Documents, or beside the exe) it offers to make the artwork from it; if
          not, it asks you to choose the zip. That takes a second or two and happens once: the
          result is a folder called "apeiron_classic_assets" beside apeiron.exe (or in your user
          profile if that folder is not writable) and the game remembers it.

          The menu and dialog fonts are free ones that are built in - see fonts\ATTRIBUTION.txt
          (and fonts-credits.txt, which the game writes into the folder it makes) - so Apple's
          fonts are not needed.

          Already have a folder made with the Python tools (apeiron-asset-tools.zip, or
          tools/extract_assets.py)? Put it beside apeiron.exe, or pass its path:

              apeiron.exe C:\some\where\apeiron_classic_assets

          The port and its tools are in this repository; see README.md.
          SDL3 is linked statically and is zlib-licensed - see SDL-LICENSE.txt.
          TXT

          7z a "$stage.zip" "$stage"
          ls -la apeiron-*

      - uses: actions/upload-artifact@v4
        with:
          name: apeiron-windows-x86_64
          path: apeiron-*.zip
          if-no-files-found: error

  # ----------------------------------------------------------------------- the Android build
  # A sideloadable APK: it appears on the Google TV home screen by itself, and finds its artwork
  # through the game's own folder browser. 32-bit ARM only.
  #
  # SDL is not compiled here. SDL's own release carries a prebuilt AAR - its Java and a built
  # libSDL3.so for each ABI - which android/get-sdl.sh downloads, checks against the checksum pinned
  # in android/SDL_SHA256 and unpacks into app/libs.
  android:
    name: android-apk
    needs: stamp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Not the runner's Gradle: it is version 9, and the Android plugin this project uses is
      # an 8.x, which fails against it with a misleading error about DependencyHandler.module.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: fetch SDL's prebuilt Android package
        run: ./android/get-sdl.sh

      - name: build the APK
        run: |
          set -e
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          NDKVER=$(basename "$ANDROID_NDK_HOME")
          echo "building against NDK $NDKVER"
          cd android
          gradle --no-daemon assembleRelease \
                 -PapeironNdk="$NDKVER" \
                 -PapeironStamp=${{ needs.stamp.outputs.stamp }} \
                 -PapeironName=${{ needs.stamp.outputs.name }}

      - name: collect the artifact
        run: |
          set -e
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$apk" || { find android/app/build/outputs | head -40; exit 1; }
          unzip -l "$apk" | grep -E 'lib/|\.so' || true

          # What actually went into it. A build that quietly picked up the wrong ABI, or came out
          # without SDL's Java, installs fine and then does not start.
          libs=$(unzip -Z1 "$apk" | grep -E '^lib/' | LC_ALL=C sort)
          echo "$libs"
          test "$libs" = "$(printf 'lib/armeabi-v7a/libSDL3.so\nlib/armeabi-v7a/libmain.so')" \
            || { echo "expected exactly libSDL3.so and libmain.so for armeabi-v7a"; exit 1; }
          unzip -p "$apk" 'classes*.dex' | grep -aq 'Lorg/libsdl/app/SDLActivity;' \
            || { echo "SDLActivity is not in the APK"; exit 1; }
          # The class the manifest names. It was once missing - a .gitignore pattern meant for the
          # executable also matched its folder - and an APK without it installs and then closes
          # the instant it is opened.
          unzip -p "$apk" 'classes*.dex' | grep -aq 'Lio/github/takasky85/apeiron/MainActivity;' \
            || { echo "MainActivity is not in the APK"; exit 1; }
          cp "$apk" apeiron.apk
          ls -la apeiron.apk


      - uses: actions/upload-artifact@v4
        with:
          # Just the APK: Actions zips it with apeiron.apk at the top, no folder inside.
          name: apeiron-android
          path: apeiron.apk
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: the asset tools, as a download of their own
        run: cp downloads/apeiron-asset-tools.zip dist/

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # draft is deliberately not set. Forcing draft: true would have un-published a release
          # made by hand in the browser, which is how releases get made here - the workflow's job
          # is to attach binaries to it, not to change its state.
          generate_release_notes: true
          files: dist/*
          body: |
            ## What is in these downloads

            | | |
            | - | - |
            | `apeiron-windows-x86_64.zip` | Windows 11 (and 10), 64-bit - one executable with SDL3 linked in, nothing else needed |
            | `apeiron.apk` | a sideloadable APK for Google TV and other 32-bit ARM Android - built against SDL's official prebuilt Android package |
            | `apeiron-asset-tools.zip` | optional: the Python script (and a small window for it) that makes the same artwork folder on a computer, with the free fonts it uses |

            ## What is NOT in them

            **The game's artwork and sounds.** Those are Ambrosia Software's, so they are not
            shipped - the game makes its own from *your* copy of Apeiron, the Apeiron 1.0.3 zip you
            downloaded for the Mac. Start it, say yes when it offers to make the artwork from the
            zip it found (or choose the zip yourself), and a second or two later it is running.
            It does the same on Android and Google TV.

            The menu and dialog fonts are free ones built into the game: Geneva 9.1 by Kelsey
            Higham (SIL Open Font License) and pixChicago by Etienne Desclides - see
            `tools/fonts/ATTRIBUTION.txt`.

            Prefer to do it by hand? `apeiron-asset-tools.zip` (or
            `python3 tools/extract_assets.py Apeiron_1.0.3.zip`) writes the identical folder, which
            can then go beside the executable or in the Download folder.

            ## Android and Google TV

            Sideload `apeiron.apk` (on a phone, open it from Downloads; on a TV use the Downloader
            app, or `adb install apeiron.apk`). Nothing asks for a permission up front. The first
            start shows a screen with big buttons: it looks for the Apeiron 1.0.3 zip you downloaded
            and offers to make the artwork from it, or you tap **Choose the zip** and pick it with
            Android's own file picker (the Downloads folder is the usual place). The result is kept
            in the game's own folder, so this happens once.

            **Phone:** hold it either way up. Upright, the playfield fills the top of the screen, the
            score, bonus, lives and wave boxes sit under it, and the controls take the rest: drag a
            thumb on the **trackball** (left) to move the shooter, the way you would roll a mouse,
            and press **fire** (right). Sideways, the whole picture fills the screen with the
            trackball and fire button in the margins either side. Pause and back are the two small
            buttons in the corner. Touch also works in all the menus, and Options has a setting to
            hide the controls.

            **Google TV and controllers:** the remote's d-pad or a controller's stick moves a focus
            ring through the menus, the centre button or A selects, and Back goes back. In play the
            d-pad or stick steers and centre or A fires.

            A mouse works too: left button fires, right pauses, middle goes back to the title.

            Without the zip or an artwork folder the game stops at startup and says what it needs.
