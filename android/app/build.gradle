plugins { id 'com.android.application' }

// yymmddhhmm, passed in by the release workflow in Pacific time so the title screen's stamp
// matches the other downloads; a local build gets this machine's clock.
def buildStamp = project.findProperty('apeironStamp') ?: new Date().format('yyMMddHHmm')
def buildName  = project.findProperty('apeironName')  ?: ''

// The SDL release this is built against. One line in android/SDL_VERSION, read by get-sdl.sh as
// well, so the file that is downloaded and the file that is linked cannot drift apart.
def sdlVersion = new File(rootDir, 'SDL_VERSION').text.trim()

android {
    namespace 'io.github.takasky85.apeiron'
    compileSdk 34
    // The runner passes the version it actually has installed; this is only a fallback.
    ndkVersion project.findProperty('apeironNdk') ?: '27.0.12077973'

    defaultConfig {
        applicationId 'io.github.takasky85.apeiron'
        minSdk 21
        // 36, as ScummVM's build has. It was 28, to keep the old unrestricted storage rules, and
        // Google Play Protect answered with "built for an older version of Android" on every
        // install. From 30 on the way to read another folder's files by path is "All files
        // access" - a switch in Settings, which the game sends you to when the artwork is not
        // already somewhere it can read. compileSdk stays at 34: a target higher than the
        // compile level is allowed, and it is the target that the system looks at.
        targetSdk 36
        versionCode 1
        versionName '1.0.3'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', "-DAPEIRON_BUILD_STAMP=${buildStamp}",
                          "-DAPEIRON_BUILD_NAME=${buildName}"
            }
        }
        // 32-bit ARM only: that is the Google TV box this is for. A phone, a newer Chromecast or
        // a Chromebook would want another, and -PapeironAbis=arm64-v8a,x86_64 builds them - the
        // SDL AAR carries all four - but they are not shipped.
        ndk {
            abiFilters.addAll(
                ((project.findProperty('apeironAbis') ?: 'armeabi-v7a') as String)
                    .split(',').collect { it.trim() }.findAll { it })
        }
    }

    // Lets CMake's find_package(SDL3) see the native half of the AAR.
    buildFeatures { prefab true }

    externalNativeBuild { cmake { path 'jni/CMakeLists.txt' } }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key on purpose: this is a sideload, and an APK signed with
            // a throwaway release key is no more trustworthy than one signed with the debug key
            // while being harder for anyone to reproduce.
            signingConfig signingConfigs.debug
        }
    }
    lint { abortOnError false }
}

dependencies {
    // SDL's Java (SDLActivity and the rest) and its prebuilt libSDL3.so, in one file.
    // android/get-sdl.sh downloads it.
    implementation files("libs/SDL3-${sdlVersion}.aar")
}

// A missing AAR otherwise shows up as a Gradle error about an unresolvable file; say what to do.
tasks.configureEach { t ->
    if (t.name.startsWith('pre') && t.name.endsWith('Build')) {
        t.doFirst {
            if (!file("libs/SDL3-${sdlVersion}.aar").exists())
                throw new GradleException("libs/SDL3-${sdlVersion}.aar is missing - run android/get-sdl.sh")
        }
    }
}
